      JOSH GORDON - Cleveland Browns wide receiver Josh Gordon, who is serving
      a one-year suspension after failing a second drug test - this time for
      marijuana - will be working at the Sarchione Auto group in Randolph, Ohio
      where his roles include on-floor salesman and head of local community
      efforts.
