      TERRELL OWENS (MARCH 7) - The NFL Players Association plans to file
      paperwork in an attempt to rescind wide receiver Terrell Owens' trade
      from the San Francisco 49ers to the Baltimore Ravens after Owens said he
      wants to play for the Philadelphia Eagles, who are desperate for a
      number-one receiver.
